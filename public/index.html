<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperFrames</title>
    
    <!-- Tailwind CSS compiled by Vite -->
    <link rel="stylesheet" href="/build/assets/app-CNA9Ilz7.css">
    <link rel="stylesheet" href="/build/assets/app-OXnh2iqD.css">
</head>
<body class="bg-[var(--color-background)]">

    <!-- FAQ Section -->
    <section class="pt-6 pb-16 bg-[var(--color-background)]">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">

            <!-- Section Heading -->
            <div class="text-center max-w-2xl mx-auto mb-12">
                <h2 class="font-heading text-3xl sm:text-4xl font-bold text-[var(--color-primary)]">
                    Frequently Asked Questions
                </h2>
                <div class="flex items-center justify-center gap-2 my-3 text-[var(--color-secondary)]">
                    <span class="h-[1px] w-12 bg-[var(--color-secondary)]/30"></span>
                    <i data-lucide="heart" class="w-4 h-4"></i>
                    <span class="h-[1px] w-12 bg-[var(--color-secondary)]/30"></span>
                </div>
            </div>

            <!-- Accordion Container -->
            <div x-data="{ active: null }" class="space-y-4">
                
                <!-- FAQ Item 1 -->
                <div class="bg-white rounded-xl border border-[var(--color-border)] overflow-hidden shadow-xs">
                    <button type="button"
                        @click="active = (active === 0 ? null : 0)"
                        class="w-full px-6 py-4 text-left flex items-center justify-between gap-4 font-heading text-lg font-semibold text-[var(--color-primary)] hover:text-[var(--color-primary-hover)] transition-colors focus:outline-none">
                        <span>What is SuperFrames?</span>
                        <i data-lucide="chevron-down" class="w-5 h-5 shrink-0 transition-transform duration-300"
                            :class="{ 'rotate-180': active === 0 }"></i>
                    </button>
                    <div x-show="active === 0" x-collapse x-cloak>
                        <div class="px-6 pb-5 pt-1 text-sm text-[var(--color-body)] leading-relaxed border-t border-[var(--color-border)]/50">
                            SuperFrames is a high-performance frontend framework designed for building beautiful web applications.
                        </div>
                    </div>
                </div>

                <!-- FAQ Item 2 -->
                <div class="bg-white rounded-xl border border-[var(--color-border)] overflow-hidden shadow-xs">
                    <button type="button"
                        @click="active = (active === 1 ? null : 1)"
                        class="w-full px-6 py-4 text-left flex items-center justify-between gap-4 font-heading text-lg font-semibold text-[var(--color-primary)] hover:text-[var(--color-primary-hover)] transition-colors focus:outline-none">
                        <span>How can I deploy this project?</span>
                        <i data-lucide="chevron-down" class="w-5 h-5 shrink-0 transition-transform duration-300"
                            :class="{ 'rotate-180': active === 1 }"></i>
                    </button>
                    <div x-show="active === 1" x-collapse x-cloak>
                        <div class="px-6 pb-5 pt-1 text-sm text-[var(--color-body)] leading-relaxed border-t border-[var(--color-border)]/50">
                            You can easily deploy it as a static site on platforms like Vercel or Netlify using pre-compiled assets.
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </section>

    <!-- Main JS bundle generated by Vite (Includes Alpine.js, Lucide icons init, etc.) -->
    <script type="module" src="/build/assets/app-B6UI44Wn.js"></script>
</body>
</html>
